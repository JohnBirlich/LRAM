name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc and the Vite build, which also gives tauri::generate_context! its ../dist.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked 2>&1 | Tee-Object -FilePath ci.txt
        working-directory: src-tauri
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings 2>&1 | Tee-Object -FilePath ci.txt
        working-directory: src-tauri
      - if: failure()
        shell: bash
        run: |
          { echo '```'; tail -n 60 ci.txt src-tauri/ci.txt 2>/dev/null; echo '```'; } > note.md
          n=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh pr comment "$n" --body-file note.md; fi
        env:
          GH_TOKEN: ${{ github.token }}
