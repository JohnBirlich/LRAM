name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc and the Vite build, which also gives tauri::generate_context! its ../dist.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked 2>&1 | Tee-Object -FilePath ci.txt
        working-directory: src-tauri
      - if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings 2>&1 | Tee-Object -FilePath ci.txt
        working-directory: src-tauri
      - if: failure()
        shell: bash
        run: |
          { echo '```'; tail -n 60 src-tauri/ci.txt 2>/dev/null || true; echo '```'; } > note.md
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[0].number' 2>/dev/null || true)
          if [ -n "$n" ] && [ "$n" != "null" ]; then gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$n/comments" -F body=@note.md >/dev/null; fi
        env:
          GH_TOKEN: ${{ github.token }}
