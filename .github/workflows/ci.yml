name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:capacity
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: |
          $output = & cargo test --locked --color never 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 160) -join "%0A"
            Write-Output "::error title=Rust tests failed::$tail"
            exit $code
          }
        working-directory: src-tauri
      - if: ${{ !cancelled() }}
        run: |
          $output = & cargo clippy --all-targets --locked --color never -- -D warnings 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 120) -join "%0A"
            Write-Output "::error title=Clippy failed::$tail"
            exit $code
          }
        working-directory: src-tauri
