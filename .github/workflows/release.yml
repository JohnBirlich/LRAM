name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      signed: ${{ env.HAS_SIGNPATH }}
      self_signed: ${{ env.HAS_UPDATE_KEY }}
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      HAS_UPDATE_KEY: ${{ secrets.LRAM_UPDATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          $version = (Get-Content -Raw src-tauri\tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            echo "::error::tag $env:GITHUB_REF_NAME is not v$version, the version in src-tauri/tauri.conf.json: tag v$version instead, or set the version in tauri.conf.json, package.json and src-tauri/Cargo.toml first"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and verify frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:capacity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:privacy
      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri
      - name: Inno Setup 6.6+
        run: choco upgrade innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1
      - uses: actions/upload-artifact@v7
        id: unsigned
        if: env.HAS_SIGNPATH == 'true'
        with:
          name: unsigned
          path: dist-installer/LRAM-Setup-${{ steps.v.outputs.version }}.exe
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@v2
        if: env.HAS_SIGNPATH == 'true'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: LRAM
          signing-policy-slug: release-signing
          artifact-configuration-slug: github-ci
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
      - name: Use the signed installer
        if: env.HAS_SIGNPATH == 'true'
        run: Copy-Item "dist-signed\LRAM-Setup-${{ steps.v.outputs.version }}.exe" dist-installer\ -Force
      - name: Sign the installer for the self-updater
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          LRAM_UPDATE_KEY: ${{ secrets.LRAM_UPDATE_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const key = process.env.LRAM_UPDATE_KEY;
            if (!key) { console.log("::error::the LRAM_UPDATE_KEY secret is not set: the installer cannot be signed"); process.exit(1); }
            const name = `LRAM-Setup-${process.env.VERSION}.exe`, exe = `dist-installer/${name}`;
            const data = Buffer.concat([Buffer.from(name + "\n"), fs.readFileSync(exe)]);
            const sig = crypto.sign("sha256", data, { key, dsaEncoding: "ieee-p1363" });
            const hex = fs.readFileSync("src-tauri/src/self_update.rs", "utf8").match(/const PUBLIC_KEY: &str = "([0-9a-f]{128})"/)[1];
            const xy = Buffer.from(hex, "hex"), b64 = (b) => b.toString("base64url");
            const pub = crypto.createPublicKey({ key: { kty: "EC", crv: "P-256", x: b64(xy.subarray(0, 32)), y: b64(xy.subarray(32)) }, format: "jwk" });
            if (!crypto.verify("sha256", data, { key: pub, dsaEncoding: "ieee-p1363" }, sig)) {
              console.log("::error::LRAM_UPDATE_KEY is not the key whose public half is PUBLIC_KEY in self_update.rs: LRAM would refuse this installer");
              process.exit(1);
            }
            fs.writeFileSync(exe + ".sig", sig.toString("base64"));
            console.log("signed " + exe);
          '
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist-installer/LRAM-Setup-${{ steps.v.outputs.version }}.exe
            dist-installer/LRAM-Setup-${{ steps.v.outputs.version }}.exe.sig
          if-no-files-found: ignore

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Draft release with SHA-256 sums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.windows.outputs.tag }}
          VERSION: ${{ needs.windows.outputs.version }}
          SIGNED: ${{ needs.windows.outputs.signed }}
          UPDATER_SIGNED: ${{ needs.windows.outputs.self_signed }}
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          updater=""
          if [ "$UPDATER_SIGNED" = true ]; then
            test -s "LRAM-Setup-$VERSION.exe.sig" || { echo "::error::LRAM-Setup-$VERSION.exe.sig is missing"; exit 1; }
            updater="LRAM-Setup-$VERSION.exe.sig is the signature LRAM's built-in updater checks before it runs the installer."
          else
            rm -f "LRAM-Setup-$VERSION.exe.sig"
            updater="This build carries no updater key: install new versions by hand from this page."
          fi
          signing="No Authenticode signature yet: SmartScreen warns."
          if [ "$SIGNED" = true ]; then signing="Code signed."; fi
          cat > ../notes.md <<EOF
          ## LRAM $VERSION

          - Persistent Privacy mode: Hidden identities/statuses/groups/notes/game details, blank avatars and hidden previews, hardware, displays and IP/location. UI masking only, not network anonymity or export/log sanitization.
          - Monitor separates Graphics adapters from Peripherals / Displays. GPU deduplication uses Windows adapter LUIDs, never model names or monitor count; display names, current resolution and refresh rate are read from Windows.
          - Strict ULTRA replaces adaptive CPU behavior: 1% by default, selectable 1% or 2%, including focus/loading/teleports. 5 FPS and maximum-performance graphics on the next launch; no window-size/resolution changes. Extremely low ceilings can slow loading and disconnect clients; instantaneous Windows readings are not a hard real-time guarantee.
          - Home client menu / Limits: four presets, individual FPS/graphics, Apply for selected client and Apply to all running accounts. CPU/Eco limits apply immediately; Requires restart marks pending FPS/graphics. Restart to apply asks for confirmation and restarts only the selected client. Account overrides persist for future launches; unrelated saved accounts are not changed.
          - Existing identity-safe process verification/recovery and measured capacity features are retained. No fixed CPU/RAM/client-count guarantees.

          **Security notice:** Defender detections were reported for 0.12.4. Their cause has not been established and this release has not been cleared by Microsoft. Do not disable antivirus or add exclusions to run LRAM. SHA-256 verifies file identity, not safety.

          $signing The SHA-256 sums are below and in SHA256SUMS.txt. $updater

          - **Windows** 10 1809 or later, or Windows 11, x64: LRAM-Setup-$VERSION.exe. Do not bypass antivirus detections.
          - Needs the Microsoft Edge WebView2 Runtime (Windows 11 has it). Setup checks, and offers Microsoft's download when it is missing.

          ~~~
          $(cat SHA256SUMS.txt)
          ~~~
          EOF
          if tag_sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null) && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG is at $tag_sha, not $GITHUB_SHA: raise the version, or run the workflow from the tag"
            exit 1
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published: raise the version for a new release"
              exit 1
            fi
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file ../notes.md
          else
            gh release create "$TAG" ./* --draft --target "$GITHUB_SHA" --title "LRAM $VERSION" --notes-file ../notes.md
          fi
