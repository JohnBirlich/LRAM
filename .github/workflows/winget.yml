name: Winget

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: windows-latest
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Skipped without WINGET_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: echo "WINGET_TOKEN isn't set; not publishing to winget."
      - uses: vedantmgoyal9/winget-releaser@main
        if: env.HAS_TOKEN == 'true'
        with:
          identifier: JohnBirlich.LRAM
          installers-regex: 'LRAM-Setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
